name: Reset Job Tracker Sheets

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RESET to confirm deletion of managed sheet content
        required: true
        type: string
      include_archive:
        description: Also delete all rows from Archived Jobs
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: job-tracker-sheet-writes
  cancel-in-progress: false

jobs:
  reset-sheets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reset managed sheet content
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RESET_CONFIRMATION: ${{ inputs.confirmation }}
          INCLUDE_ARCHIVE: ${{ inputs.include_archive }}
        run: npm run reset:sheets
