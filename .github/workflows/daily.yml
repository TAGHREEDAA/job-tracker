name: Daily Job Tracker

on:
  schedule:
    # Runs daily at 06:00 UTC = 08:00 Cairo (UTC+2) / 09:00 Cairo in DST
    - cron: '0 6 * * *'
  workflow_dispatch: # allows manual trigger from GitHub UI

permissions:
  contents: read

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    concurrency:
      group: job-tracker-sheet-writes
      cancel-in-progress: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci # Fixed: Removed 'npm install' fallback to enforce lockfile speed

      - name: Run tracker
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PRIVATE_REGISTRY_SHEET_ID: ${{ secrets.PRIVATE_REGISTRY_SHEET_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: npm start
