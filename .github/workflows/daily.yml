name: Daily Job Tracker

on:
  schedule:
    # Runs daily at 06:00 UTC = 08:00 Cairo (UTC+2) / 09:00 Cairo in DST
    - cron: '0 6 * * *'
  workflow_dispatch: # allows manual trigger from GitHub UI

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2 # Fixed: Uses Node 24 runtime internally

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0 # Fixed: Switched internal runner to Node 24
        with:
          node-version: '22' # Fixed: Upgraded your app runner to Node 22 (current LTS)
          cache: 'npm'

      - name: Install dependencies
        run: npm ci # Fixed: Removed 'npm install' fallback to enforce lockfile speed

      - name: Run tracker
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: npm start
